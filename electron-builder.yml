appId: ai.chaterm.app
productName: Chaterm
compression: maximum
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!dist/**/*'
  - '!coverage/**/*'
  - '!tests/**/*'
  - '!test_data/**/*'
  - '!docs/**/*'
  - '!.spec-workflow/**/*'
  - '!.claude/**/*'
  - '!__mocks__/**/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{babel.config.js,playwright.config.ts}'
  - '!{AGENTS.md,CLAUDE.md,CODE_OF_CONDUCT.md,CONTRIBUTING.md,CONTRIBUTING_zh.md,README_zh.md,SECURITY.md}'
  - '!node_modules/**/*.ts'
  - '!node_modules/**/*.map'
  - '!node_modules/**/test/**'
  - '!node_modules/**/tests/**'
  - '!node_modules/**/docs/**'
  - '!node_modules/**/documentation/**'
  - '!node_modules/**/examples/**'
  - '!node_modules/**/.github/**'
  - '!node_modules/**/README.md'
  - '!node_modules/**/readme.md'
  - '!node_modules/**/CHANGELOG.md'
  - '!node_modules/**/changelog.md'
  - '!node_modules/**/LICENSE*'
  - '!node_modules/**/license*'
  - '!node_modules/**/*.d.ts'
  - '!node_modules/**/*.flow'
  - '!node_modules/**/.DS_Store'
  - '!node_modules/**/Thumbs.db'
  - '!resources/demo.mp4'
  - '!resources/demo.jpg'
  - '!resources/deploy.jpg'
  - '!node_modules/**/webpack/**'
  - '!node_modules/**/rollup/**'
  - '!node_modules/**/vite/**'
  - '!node_modules/**/@types/**'
  - '!node_modules/monaco-editor/esm/vs/language/!(typescript|javascript|json|css|html)/**'
  - '!node_modules/monaco-editor/min/vs/language/!(typescript|javascript|json|css|html)/**'
extraResources:
  - from: 'src/renderer/src/assets/db/'
    to: 'db/'
    filter: '**/*.db'
  - from: 'src/main/services/knowledgebase/'
    to: 'knowledgebase/'
    filter: '**/*'
  - from: 'resources/update-notes.json'
    to: 'update-notes.json'
  - from: 'keyword-highlight.json'
    to: 'keyword-highlight.json'
  - from: 'resources/preinstalled-plugins/'
    to: 'preinstalled-plugins/'
    filter: '**/*'
  - from: 'build/edition-config/'
    to: 'edition-config/'
    filter: '**/*.json'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
  - node_modules/oracledb/**
icon: resources/icon.ico
win:
  executableName: Chaterm
  artifactName: ${name}-${version}-setup-${arch}.${ext}
  protocols:
    - name: Chaterm
      schemes:
        - chaterm
nsis:
  artifactName: ${name}-${version}-setup-${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  guid: ai.chaterm.app
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${name}-${version}-macos-${arch}.${ext}
  protocols:
    - name: Chaterm
      schemes:
        - chaterm
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: ${name}-${version}-macos-${arch}.${ext}
  title: ${productName}-${version}-${arch}
linux:
  target:
    - AppImage
    - deb
  executableName: chaterm
  maintainer: chaterm.ai
  category: Utility
  artifactName: ${name}-${version}-linux-${arch}.${ext}
deb:
  packageName: chaterm
npmRebuild: true
# Auto update is temporarily disabled for YiXin-only builds.
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
